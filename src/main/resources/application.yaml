spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: MyProfessor
  datasource:
    url: jdbc:postgresql://localhost:5432/myprofessor
    username: gregco7
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    anthropic:
      api-key: ${CLAUDE_KEY}
      # Planning a lesson is a long single response; the 10 minute client default
      # is not enough headroom once several of them run at once.
      timeout: 20m
